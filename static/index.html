<!DOCTYPE html>
<html>
<head>
    <title>Flashback Avatar - Voice Enabled</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .header h1 {
            color: white;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }

        .container {
            flex: 1;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 30px 20px;
            display: flex;
            gap: 30px;
        }

        .avatar-panel {
            flex: 1;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        #status {
            text-align: center;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 14px;
        }

        .connected { background: #10b981; color: white; }
        .disconnected { background: #ef4444; color: white; }
        .thinking { background: #f59e0b; color: white; }
        .listening { background: #8b5cf6; color: white; }

        #avatar-container {
            width: 100%;
            aspect-ratio: 1;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #avatar-video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        #avatar-audio {
            display: none;
        }

        .placeholder {
            color: #666;
            text-align: center;
            padding: 40px;
        }

        .chat-panel {
            flex: 1;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
        }

        .chat-panel h2 {
            margin-bottom: 20px;
            color: #1f2937;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            background: #f9fafb;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            min-height: 400px;
        }

        .message {
            margin: 15px 0;
            padding: 12px 18px;
            border-radius: 12px;
            max-width: 80%;
            word-wrap: break-word;
        }

        .user-message {
            background: #667eea;
            color: white;
            margin-left: auto;
            text-align: right;
        }

        .avatar-message {
            background: #10b981;
            color: white;
        }

        .context-info {
            font-size: 11px;
            margin-top: 5px;
            opacity: 0.8;
        }

        #input-container {
            display: flex;
            gap: 10px;
        }

        #user-input {
            flex: 1;
            padding: 15px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 16px;
        }

        #user-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
        }

        #send-btn {
            background: #667eea;
            color: white;
        }

        #send-btn:hover { background: #5568d3; }

        #voice-btn {
            background: #8b5cf6;
            color: white;
            min-width: 60px;
        }

        #voice-btn.listening {
            background: #ef4444;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        @media (max-width: 1024px) {
            .container { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Flashback Labs</h1>
        <!-- <p>Real-Time AI Avatar</p> -->
    </div>

    <div class="container">
        <div class="avatar-panel">
            <div id="status" class="disconnected">Not Connected</div>
            <div id="avatar-container">
                <video id="avatar-video" autoplay muted style="display:none;"></video>
                <audio id="avatar-audio" autoplay></audio>
                <div id="placeholder" class="placeholder">
                    <h3>Ready</h3>
                    <p>Click "Connect" to start video call</p>
                    <button id="connect-btn" class="btn" onclick="connectToAvatar()" style="margin-top: 20px;">Connect</button>
                </div>
            </div>
        </div>

        <div class="chat-panel">
            <h2>💬 Conversation with Vinay</h2>
            <div id="messages"></div>
            <div id="input-container">
                <button id="mic-btn" class="btn" onclick="toggleMic()" disabled>🎤</button>
                <input type="text" id="user-input" placeholder="Ask about Flashback Labs, TEEPIN, or anything..." disabled />
                <button id="send-btn" class="btn" onclick="sendMessage()" disabled>Send</button>
            </div>
        </div>
    </div>

    <script>
        let ws;
        let recognition;
        let isListening = false;
        let isMuted = false;
        let isConnected = false;

        const statusDiv = document.getElementById('status');
        const messagesDiv = document.getElementById('messages');
        const userInput = document.getElementById('user-input');
        const avatarVideo = document.getElementById('avatar-video');
        const avatarAudio = document.getElementById('avatar-audio');
        const placeholder = document.getElementById('placeholder');
        const micBtn = document.getElementById('mic-btn');
        const sendBtn = document.getElementById('send-btn');
        const connectBtn = document.getElementById('connect-btn');

        // Initialize Speech Recognition
        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                userInput.value = transcript;
                sendMessage();
            };

            recognition.onend = () => {
                isListening = false;
                micBtn.classList.remove('listening');
                if (!isMuted) {
                    micBtn.textContent = '🎤';
                }
            };
        }

        function toggleMic() {
            if (!isConnected) return;

            isMuted = !isMuted;
            micBtn.textContent = isMuted ? '🔇' : '🎤';
            micBtn.style.background = isMuted ? '#ef4444' : '#8b5cf6';

            if (isMuted && isListening) {
                recognition.stop();
            }
        }

        function connectToAvatar() {
            if (isConnected) return;

            connectBtn.disabled = true;
            connectBtn.textContent = 'Connecting...';
            statusDiv.textContent = '🔌 Connecting...';
            statusDiv.className = 'thinking';

            connect();
        }

        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

            ws.onopen = () => {
                isConnected = true;
                statusDiv.textContent = '✅ Connected - Video Call Active';
                statusDiv.className = 'connected';

                // Enable controls
                micBtn.disabled = false;
                userInput.disabled = false;
                sendBtn.disabled = false;

                // Hide connect button
                connectBtn.style.display = 'none';
            };

            ws.onclose = () => {
                isConnected = false;
                statusDiv.textContent = '❌ Disconnected';
                statusDiv.className = 'disconnected';

                // Disable controls
                micBtn.disabled = true;
                userInput.disabled = true;
                sendBtn.disabled = true;

                // Show connect button again
                connectBtn.style.display = 'block';
                connectBtn.disabled = false;
                connectBtn.textContent = 'Connect';
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);

                if (data.status === 'initializing') {
                    statusDiv.textContent = '🎬 Initializing Avatar...';
                    statusDiv.className = 'thinking';
                    return;
                }

                if (data.status === 'thinking') {
                    statusDiv.textContent = '🤔 Thinking...';
                    statusDiv.className = 'thinking';
                    return;
                }

                if (data.error) {
                    alert('Error: ' + data.error);
                    statusDiv.textContent = '✅ Ready';
                    statusDiv.className = 'connected';
                    return;
                }

                // Handle welcome or response
                if (data.type === 'welcome' || data.type === 'response') {
                    let contextInfo = '';
                    if (data.context_used) {
                        contextInfo = '<div class="context-info">📚 Used Flashback knowledge</div>';
                    }
                    addMessage(data.text + contextInfo, 'avatar');

                    if (data.video_url) {
                        placeholder.style.display = 'none';
                        avatarVideo.src = data.video_url + '?t=' + Date.now();
                        avatarVideo.style.display = 'block';
                        avatarVideo.play();
                    }

                    if (data.audio_url) {
                        avatarAudio.src = data.audio_url + '?t=' + Date.now();
                        avatarAudio.play();
                    }

                    statusDiv.textContent = '✅ Ready';
                    statusDiv.className = 'connected';
                }
            };
        }

        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ' + (sender === 'user' ? 'user-message' : 'avatar-message');
            messageDiv.innerHTML = (sender === 'user' ? 'You: ' : 'Vinay: ') + text;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function sendMessage() {
            const message = userInput.value.trim();
            if (!message || !ws || ws.readyState !== WebSocket.OPEN) return;

            addMessage(message, 'user');
            ws.send(JSON.stringify({ message: message }));
            userInput.value = '';
        }

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Don't auto-connect - wait for user to click Connect button
    </script>
</body>
</html>
